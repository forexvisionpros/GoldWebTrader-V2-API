<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldWebTrader V2 — Mobile Dashboard</title>
  <style>
    :root {
      --bg-color: #121214; --card-bg: #1a1a1e; --text-color: #e2e8f0; --text-muted: #94a3b8;
      --primary: #f59e0b; --primary-hover: #d97706; --success: #10b981; --danger: #ef4444; --border: #2d2d34;
    }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
    header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
    .status-badge { align-self: flex-start; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .status-badge.connected { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button { background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button.btn-primary { background-color: var(--primary); color: #000; border: none; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card h2 { margin-top: 0; font-size: 1.1rem; color: var(--primary); }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2d2d34; font-size: 0.9rem; }
    .console { background-color: #000; font-family: monospace; font-size: 0.75rem; padding: 12px; border-radius: 8px; height: 150px; overflow-y: auto; color: #39ff14; }
    .input-key { background: #000; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>GoldWebTrader V2</h1>
    <div id="conn-badge" class="status-badge">Disconnected</div>
    <input type="password" id="api-key-input" class="input-key" placeholder="Enter X-API-Key Configuration">
    <div class="btn-group">
      <button class="btn-primary" onclick="initiateOAuth()">Deriv OAuth Login</button>
      <button onclick="clearSavedAuth()" style="color: var(--danger);">Clear Cache</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Account Status</h2>
      <div class="row"><span>Deriv Status</span><span id="acc-connected">—</span></div>
      <div class="row"><span>Account Type</span><span id="acc-type">—</span></div>
      <div class="row"><span>Login ID</span><span id="acc-id">—</span></div>
      <div class="row"><span>WS State</span><span id="ws-status">—</span></div>
      <div class="row"><span>V75 Price</span><span id="market-price" style="color:var(--primary);">—</span></div>
    </div>

    <div class="card">
      <h2>Trading Status</h2>
      <div class="row"><span>Engine State</span><span id="eng-status">—</span></div>
      <div class="row"><span>Auto Loop</span><span id="eng-enabled">—</span></div>
      <div class="row"><span>Execution</span><span id="eng-execute">—</span></div>
      <div class="row"><span>Signal</span><span id="eng-signal">—</span></div>
    </div>
  </div>

  <div class="card" style="margin-top: 15px;">
    <h2>Controls</h2>
    <div class="btn-group">
      <button onclick="postCommand('/v75/engine/start')">Start Loop</button>
      <button onclick="postCommand('/v75/engine/stop')">Stop Loop</button>
      <button onclick="toggleSetting('executeTrades')" class="btn-primary">Toggle Live Execution</button>
    </div>
  </div>

  <div class="card" style="margin-top: 15px;">
    <h2>Live Logs</h2>
    <div class="console" id="log-console">Awaiting data stream sync...</div>
  </div>

  <script>
    const BASE_API_URL = window.location.origin;
    let currentEngineState = {};

    document.addEventListener("DOMContentLoaded", () => {
      if(localStorage.getItem("dashboard_api_key")) {
        document.getElementById("api-key-input").value = localStorage.getItem("dashboard_api_key");
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("oauth_success") === "true") {
        localStorage.setItem("deriv_token", urlParams.get("token"));
        localStorage.setItem("deriv_account", urlParams.get("account"));
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      pollServerRuntimeState();
      setInterval(pollServerRuntimeState, 3000);
    });

    function fetchHeaders() {
      const headers = { "Content-Type": "application/json" };
      const apiKey = document.getElementById("api-key-input").value;
      if (apiKey) { headers["X-API-Key"] = apiKey; localStorage.setItem("dashboard_api_key", apiKey); }
      return headers;
    }

    async function pollServerRuntimeState() {
      const token = localStorage.getItem("deriv_token");
      const account = localStorage.getItem("deriv_account");
      let url = `${BASE_API_URL}/status`;
      if (token && account) url += `?token=${encodeURIComponent(token)}&account=${encodeURIComponent(account)}`;

      try {
        const response = await fetch(url, { headers: fetchHeaders() });
        const data = await response.json();
        updateDashboardUserInterface(data);
      } catch (err) {
        document.getElementById("conn-badge").className = "status-badge";
        document.getElementById("conn-badge").innerText = "Network Error";
      }
      fetchLogsData();
    }

    function updateDashboardUserInterface(data) {
      if (!data.ok) return;
      const badge = document.getElementById("conn-badge");
      currentEngineState = data.engine || {};

      if (data.oauth && data.oauth.accountId && data.oauth.accountId !== "demo") {
        badge.className = "status-badge connected"; badge.innerText = "Connected Profile Live";
        document.getElementById("acc-connected").innerText = "Active";
        document.getElementById("acc-id").innerText = data.oauth.accountId;
      } else {
        badge.className = "status-badge"; badge.innerText = "Disconnected";
        document.getElementById("acc-connected").innerText = "Offline";
        document.getElementById("acc-id").innerText = "—";
      }

      document.getElementById("acc-type").innerText = data.oauth?.accountType || "—";
      document.getElementById("ws-status").innerText = data.websocket?.connected ? "Online" : "Offline";
      document.getElementById("market-price").innerText = data.market?.price ? Number(data.market.price).toFixed(2) : "Fetching...";
      document.getElementById("eng-status").innerText = data.engine?.status || "—";
      document.getElementById("eng-enabled").innerText = data.engine?.enabled ? "ACTIVE" : "STOPPED";
      document.getElementById("eng-execute").innerText = data.engine?.executeTrades ? "LIVE TRADING" : "SIMULATION";
      document.getElementById("eng-signal").innerText = data.engine?.lastSignal || "WAITING";
    }

    async function fetchLogsData() {
      const token = localStorage.getItem("deriv_token");
      const account = localStorage.getItem("deriv_account");
      let url = `${BASE_API_URL}/logs`;
      if (token && account) url += `?token=${encodeURIComponent(token)}&account=${encodeURIComponent(account)}`;
      try {
        const res = await fetch(url, { headers: fetchHeaders() });
        const data = await res.json();
        if (data.ok && Array.isArray(data.logs)) {
          document.getElementById("log-console").innerHTML = data.logs.map(l => `<div>[${l.time.substring(11, 19)}] ${l.message}</div>`).join('');
        }
      } catch (e) {}
    }

    async function postCommand(endpoint, payload = {}) {
      const token = localStorage.getItem("deriv_token");
      const account = localStorage.getItem("deriv_account");
      let url = `${BASE_API_URL}${endpoint}`;
      if (token && account) url += `?token=${encodeURIComponent(token)}&account=${encodeURIComponent(account)}`;
      try {
        await fetch(url, { method: "POST", headers: fetchHeaders(), body: Object.keys(payload).length ? JSON.stringify(payload) : undefined });
        pollServerRuntimeState();
      } catch(e) {}
    }

    function toggleSetting(field) {
      if(currentEngineState[field] === undefined) return;
      const p = {}; p[field] = !currentEngineState[field];
      postCommand('/v75/engine/settings', p);
    }

    function initiateOAuth() { window.location.href = `${BASE_API_URL}/oauth/login`; }
    function clearSavedAuth() { localStorage.clear(); window.location.reload(); }
  </script>
</body>
</html>
